<!DOCTYPE html>
<html>
<head>
    <title>Server Testing - Live Map Tracker</title>
    <style>

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

   
        .dashboard-card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

    
        #Button {
            background: linear-gradient(135deg, #1f6feb 0%, #0950be 100%);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 14px rgba(31, 111, 235, 0.3);
        }

        #Button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31, 111, 235, 0.5);
            background: linear-gradient(135deg, #388bfd 0%, #1f6feb 100%);
        }

        #Button:active {
            transform: translateY(1px);
        }

   
        #output {
            margin-top: 24px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            background-color: #161b22;
            border: 1px dashed #444c56;
            padding: 12px;
            border-radius: 6px;
            color: #58a6ff;
            min-height: 20px;
            word-break: break-all;
        }

        #mapContainer {
            width: 100%;
            display: flex;
            justify-content: center;
        }

      
        iframe {
            margin-top: 24px;
            border: 1px solid #30363d;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            background-color: #0d1117;
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h1>🛰️ Geolocation Server Portal</h1>
    
    <button id="Button">Locate Remote Session</button>
    
    <div id="output">System Ready. Awaiting connection command...</div>
    <div id="mapContainer"></div>
</div>


        
      <script>
let Button = document.getElementById("Button");
let output = document.getElementById("output");
let mapContainer = document.getElementById("mapContainer");

Button.addEventListener("click", function() {
    output.textContent = "Querying live Render node...";
    
    // FIX: Completely clean target domain pointing explicitly to your app route mapping
    fetch("https://onrender.com")
    .then(response => {
        if (!response.ok) {
            throw new Error("HTTP network response error code: " + response.status);
        }
        return response.text();
    })
    .then(coordinates => {
        if (coordinates === "Unknown" || !coordinates.includes(",")) {
            output.textContent = "⚠️ Error: Could not resolve target IP space geometries.";
            return;
        }
        
        output.textContent = "🎯 Signal locked: [ " + coordinates + " ]";
        
        let [lat, lon] = coordinates.split(",");
        
        mapContainer.innerHTML = `
            <iframe 
                width="100%" 
                height="400" 
                src="https://openstreetmap.org{parseFloat(lon)-0.05}%2C${parseFloat(lat)-0.05}%2C${parseFloat(lon)+0.05}%2C${parseFloat(lat)+0.05}&layer=mapnik&marker=${lat}%2C${lon}">
            </iframe>
        `;
    })
    .catch(error => {
        output.textContent = "❌ Connection failed: live server unreachable or CORS handshake dropped.";
        console.error("Tracking Error Details:", error);
    });
});
</script>

</body>
</html>
